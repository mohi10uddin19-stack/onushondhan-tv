<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | অনুসন্ধান টিভি</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand">অনুসন্ধান টিভি — Admin</div><nav><a href="index.html">সাইট দেখুন</a></nav></header>
<main>
<div id="loginBox" class="panel"><h1>Admin Login</h1><p>ডেমোর ডিফল্ট লগইন: <b>admin</b> / <b>12345</b></p>
<input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="loginMsg"></p></div>
<div id="dash" class="hidden">
<div class="panel"><h2>নতুন নিউজ প্রকাশ</h2>
<input id="title" placeholder="নিউজের শিরোনাম">
<input id="category" placeholder="ক্যাটাগরি (যেমন: বাংলাদেশ)">
<input id="image" type="url" placeholder="ছবির URL (ঐচ্ছিক)">
<textarea id="body" rows="10" placeholder="নিউজের বিস্তারিত লিখুন"></textarea>
<button onclick="publish()">Publish News</button><p id="pubMsg"></p></div>
<div class="panel"><h2>প্রকাশিত নিউজ</h2><div id="adminList"></div></div>
</div></main>
<script src="app.js"></script></body></html>
